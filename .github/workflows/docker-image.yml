name: Docker Image CI

on:
  # Solo cuando la CI ha pasado en main (tipos, lint, tests de la API y E2E). Así no se despliega código roto.
  workflow_run:
    workflows: ['CI (tipos, lint y tests)']
    types: [completed]
    branches: [main]
  # A mano: primero se ejecuta la CI (job `tests`).
  workflow_dispatch:

jobs:
  tests:
    name: CI antes de desplegar (ejecución manual)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Iansaucedo/Web'
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: tests
    if: always() && github.repository == 'Iansaucedo/Web' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || needs.tests.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener usuario en minúsculas y commit
        id: repo
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"

      - name: Compilar y subir imagen unificada (Web + API)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.OWNER }}/web:latest
            ghcr.io/${{ steps.repo.outputs.OWNER }}/web:${{ steps.repo.outputs.SHA }}
