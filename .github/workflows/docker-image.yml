 name: Docker Image CI

    on:
      push:
        branches: [ "main" ]
      workflow_dispatch:

    permissions:
      contents: read
      packages: write

    jobs:
      build-and-push:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout del repositorio
            uses: actions/checkout@v4

          - name: Iniciar sesión en GitHub Container Registry
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Convertir nombre del repo a minúsculas
            id: repo
            run: echo "NAME=$(echo ${{ github.repository }} | tr '[:upper:]'
            '[:lower:]')" >> $GITHUB_OUTPUT

          - name: Compilar y subir imagen de la Web (Next.js)
            uses: docker/build-push-action@v5
            with:
              context: .
              file: apps/web/Dockerfile
              push: true
              tags: |
                ghcr.io/${{ steps.repo.outputs.NAME }}/web:latest
                ghcr.io/${{ steps.repo.outputs.NAME }}/web:${{ github.sha }}

          - name: Compilar y subir imagen de la API (Express)
            uses: docker/build-push-action@v5
            with:
              context: .
              file: apps/api/Dockerfile
              push: true
              tags: |
                ghcr.io/${{ steps.repo.outputs.NAME }}/api:latest
                ghcr.io/${{ steps.repo.outputs.NAME }}/api:${{ github.sha }}
