services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Web (Next.js). La API sigue corriendo fuera (npm run dev:api, puerto 4000);
  # para apuntar a otra API, cambia API_INTERNAL_URL y vuelve a construir (--build).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://host.docker.internal:4000}
    ports: ["3000:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  # Ejecutor de tests (Vitest + integración contra db-test en Docker)
  # Uso: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://taller:taller@db-test:5432/taller_test
      TEST_DATABASE_URL: postgresql://taller:taller@db-test:5432/taller_test
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm test"

volumes:
  dbdata:
