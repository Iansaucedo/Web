services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]

  # Web (Next.js). La API sigue corriendo fuera (npm run dev:api, puerto 4000);
  # para apuntar a otra API, cambia API_INTERNAL_URL y vuelve a construir (--build).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://host.docker.internal:4000}
    ports: ["3000:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

volumes:
  dbdata:
